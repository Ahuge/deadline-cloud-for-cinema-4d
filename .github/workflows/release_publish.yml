name: "Release: Publish"
run-name: "Release: ${{ github.event.head_commit.message }}"


on:
  release:
    types: [published]

jobs:
  Publish:
    name: Publish Release
    permissions:
      id-token: write
      contents: write
    uses: aws-deadline/.github/.github/workflows/reusable_publish_v2.yml@mainline
    with:
      installer_oses: "['Windows', 'MacOS']"
    secrets: inherit
  # PyPI does not support reusable workflows yet
  # # See https://github.com/pypi/warehouse/issues/11096
  PublishToPyPI:
    needs: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.Publish.outputs.tag }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install --upgrade hatch
      - name: Export Built Files
        id: export-files
        run: |
          cd ${GITHUB_WORKSPACE}
          REF="$(cut -d'+' -f1 <<<"${GITHUB_REF##*/}")"
          hatch -v build
          echo "whl-path=${GITHUB_WORKSPACE}/dist/deadline_cloud_for_cinema_4d-${REF}-py3-none-any.whl" >> ${GITHUB_OUTPUT}
          echo "tgz-path=${GITHUB_WORKSPACE}/dist/deadline_cloud_for_cinema_4d-${REF}.tar.gz" >> ${GITHUB_OUTPUT}
          echo "plugin-path=${GITHUB_WORKSPACE}/deadline_cloud_extension/DeadlineCloud.pyp" >> ${GITHUB_OUTPUT}
      - name: Upload Release Asset
        id: upload-release-asset-windows
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{steps.export-files.outputs.whl-path}}
            ${{steps.export-files.outputs.tgz-path}}
            ${{steps.export-files.outputs.plugin-path}}

